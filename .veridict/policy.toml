# Veridict's own policy: this repository dogfoods its tool.
version = 1

[trust]
keys = []

[[trust.identities]]
issuer = "https://token.actions.githubusercontent.com"
identity = "https://github.com/*/veridict-core/.github/workflows/veridict.yml@refs/heads/*"

[options]
allow_tree_match = false
unknown_author = "agent"

[[rule]]
name = "python"
paths = ["**/*.py"]
authors = ["human", "assisted", "agent"]
require = [
  { checker = "mypy", result = ["pass"] },
  { checker = "pytest", result = ["pass"] },
  { checker = "crosshair", result = ["pass", "skipped"] },
]

[[rule]]
name = "policy edits"
paths = [".veridict/**"]
authors = ["human", "assisted", "agent"]
require = []
