[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veridict"
version = "0.1.0"
description = "Verification evidence for AI-written code, stored in git as in-toto attestations"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
]

[project.optional-dependencies]
sigstore = ["sigstore>=4"]
checks = ["mypy", "pytest", "crosshair-tool"]
dev = ["pytest", "mypy", "crosshair-tool", "sigstore>=4"]

[project.scripts]
veridict = "veridict.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
